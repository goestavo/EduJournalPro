<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Mengajar - SMKN Sukaresik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans text-gray-800">

    <div class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <div class="text-center mb-8 border-b pb-4">
            <h1 class="text-2xl font-bold text-gray-800">APLIKASI JURNAL MENGAJAR GURU</h1>
            <h2 class="text-xl font-semibold text-gray-700">SMK NEGERI SUKARESIK</h2>
            <p class="text-gray-600">Nama Guru: AGUS IMAM MUHAROM, S.T.</p>
        </div>

        <!-- Form Input Jurnal -->
        <div class="mb-8 bg-blue-50 p-4 rounded-lg border border-blue-100">
            <h3 class="font-bold text-lg mb-4 text-blue-800">Form Input Jurnal & Absensi</h3>
            <form id="jurnalForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <div>
                    <label class="block text-sm font-semibold mb-1">Tanggal</label>
                    <input type="date" id="tanggal" required class="w-full border rounded p-2 focus:outline-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Jam Pelajaran (contoh: 1-10)</label>
                    <input type="text" id="jam" required placeholder="1-10" class="w-full border rounded p-2 focus:outline-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Kelas</label>
                    <select id="kelas" required class="w-full border rounded p-2 focus:outline-blue-500" onchange="renderAbsensiForm()">
                        <option value="">-- Pilih Kelas --</option>
                        <option value="XI TKJ 2">XI TKJ 2</option>
                        <option value="XII TKJ 2">XII TKJ 2</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Mata Pelajaran</label>
                    <input type="text" id="mapel" value="Konsentrasi Keahlian TKJ" required class="w-full border rounded p-2 focus:outline-blue-500">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold mb-1">Materi Pembelajaran</label>
                    <textarea id="materi" required rows="3" placeholder="Deskripsikan materi..." class="w-full border rounded p-2 focus:outline-blue-500"></textarea>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold mb-1">Foto Dokumentasi (Opsional, format .jpg/.png)</label>
                    <input type="file" id="dokumentasi" accept="image/*" class="w-full border rounded p-2 bg-white">
                </div>

                <!-- Form Absensi Siswa Muncul Di Sini -->
                <div id="absensiContainer" class="md:col-span-2 hidden mt-4 border-t pt-4">
                    <h4 class="font-bold text-md mb-2">Presensi Siswa (Tandai yang TIDAK HADIR saja)</h4>
                    <div id="daftarSiswa" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2 text-sm max-h-64 overflow-y-auto bg-white p-3 border rounded">
                        <!-- Checkbox siswa akan dirender via JS -->
                    </div>
                </div>

                <div class="md:col-span-2 mt-4">
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">
                        Simpan Data ke Jurnal
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabel Data Tersimpan -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">Data Jurnal Bulan Ini</h3>
                <div class="space-x-2">
                    <button onclick="hapusSemuaData()" class="bg-red-500 text-white text-sm font-bold py-2 px-4 rounded hover:bg-red-600 transition">
                        Hapus Semua Data
                    </button>
                    <button onclick="generatePDF()" class="bg-green-600 text-white text-sm font-bold py-2 px-4 rounded hover:bg-green-700 transition shadow-lg">
                        Cetak Laporan PDF
                    </button>
                </div>
            </div>
            
            <div class="overflow-x-auto border rounded">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="p-2 border">Tgl</th>
                            <th class="p-2 border">Kelas</th>
                            <th class="p-2 border">Materi</th>
                            <th class="p-2 border">Ket. Absen</th>
                            <th class="p-2 border text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelJurnal">
                        <!-- Data Jurnal Masuk Sini -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // Data Master Siswa
        const dataSiswa = {
            "XI TKJ 2": [
                "ADITYA TUBAGUS UMAM", "AHMAD PAUJAN", "AHRIL SAHRUL MUBAROK", "AIRA ZULIANTI", 
                "AJI SETIAWAN", "AULIA ARTIKA RAMADHANI", "DANDI ARDIANSYAH PURKON", "DIDAN MULYANA", 
                "DIMAS ANDREAN", "ERLYA KHOIRIL RAMADHANI", "FABIAN RIZKI PERMANA", "FAJRI RAHMAT RAMDANI", 
                "GIA NABILA", "IMAS MULYANI", "JIHAN INSANIYAH", "KEMAL ANSORI", 
                "MOCHAMAD FARHAN DARWIN KADARISMAN", "MUHAMAD FATHUR AZAIN", "MUHAMAD NABIL ASUAIL", 
                "MUHAMMAD AZZAM ALGHYFARY", "MUSTOPA", "NAZWA SITI NURAZIZAH", "NIKI ARISKA RAHAYU", 
                "NUR MASDANA CHESAR", "NURAINI ZAHRA", "PAHIRA NURAULIA", "RAIHAN AULIA RAHMAN SUSANTO", 
                "RAJIB BAMBANG HADIANA", "RICKY FATUROHMAN", "RINRIN ANNISA", "RIYAN KAMAL MUHAMAD", 
                "SELA SEPTIANI", "SOLIH SOPIAN"
            ],
            "XII TKJ 2": [
                "ADIT FAUZI", "AILA", "ALISA GUSTIANA", "AMELIA AGUSTIN", "ANISA KHULATUL UMMAH", 
                "ARDIAN RAHMAN", "ARIS SUBQI DZULQARNAEN", "AZHARUL ABYAN RAMDANI", "DHIKAL PAZDLU NOOR", 
                "DZIKRA HIBATULLAH SUKANDAR", "FAUJIA RAMADHAN", "HASNA ZULFA Q.", "INDRA NURHIDAYAT", 
                "JIHAN PARIDAH", "MALKI HIDAYAT", "MUTHIA TAZKIYA RAMADHANI", "NAUFAL PADLI", "NENG ANES", 
                "NOVAL ADITIA", "NUR ALLIZA RUBYA HANIFA", "RAHMA SUMIA", "RATNINGSIH", "RIDHO FIRMANSYAH", 
                "RIFQI DELA PUTRA", "RIZAL KRISZAN ANGGARA", "SAFIRA FITRIYANI", "SELA NURFADILAH", 
                "SISMA SINTIA", "SITI NAYYARA ZAHRA AMIRA", "SUCI SULISTIAWATI", "SUSANTI", "ZAHRA AULIA", 
                "NURUL AMELIA"
            ]
        };

        // State / Penyimpanan Data menggunakan LocalStorage
        let jurnalData = JSON.parse(localStorage.getItem('jurnalAgusImam')) || [];

        // Fungsi merender form absen sesuai pilihan kelas
        function renderAbsensiForm() {
            const kelas = document.getElementById('kelas').value;
            const container = document.getElementById('absensiContainer');
            const daftar = document.getElementById('daftarSiswa');
            
            daftar.innerHTML = '';
            
            if (kelas && dataSiswa[kelas]) {
                container.classList.remove('hidden');
                dataSiswa[kelas].forEach((siswa, index) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center space-x-2 border-b pb-1 mb-1";
                    div.innerHTML = `
                        <span class="w-5 inline-block text-xs text-gray-500">${index+1}.</span>
                        <span class="flex-1 truncate" title="${siswa}">${siswa}</span>
                        <select id="absen_${index}" class="border rounded text-xs p-1 bg-gray-50">
                            <option value="Hadir">H</option>
                            <option value="Sakit">S</option>
                            <option value="Izin">I</option>
                            <option value="Alpa">A</option>
                        </select>
                    `;
                    daftar.appendChild(div);
                });
            } else {
                container.classList.add('hidden');
            }
        }

        // Fungsi Convert Gambar ke Base64 (Untuk disimpan & dicetak di PDF)
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // Fungsi Format Tanggal Standar (DD-MM-YYYY)
        function formatTanggal(tglInput) {
            const date = new Date(tglInput);
            return `${("0" + date.getDate()).slice(-2)}-${("0" + (date.getMonth() + 1)).slice(-2)}-${date.getFullYear()}`;
        }

        // Menangani Submit Form
        document.getElementById('jurnalForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const kelas = document.getElementById('kelas').value;
            let ketAbsenArr = [];
            let detailAbsenSiswa = {};
            
            // Cek absen tiap siswa
            dataSiswa[kelas].forEach((siswa, index) => {
                const status = document.getElementById(`absen_${index}`).value;
                detailAbsenSiswa[siswa] = status;
                if (status !== 'Hadir') {
                    ketAbsenArr.push(`${siswa} (${status})`);
                }
            });

            let ketAbsenText = ketAbsenArr.length > 0 ? ketAbsenArr.join(', ') : "Semua Siswa Hadir";

            // Proses Foto
            const fileInput = document.getElementById('dokumentasi');
            let fotoBase64 = null;
            if (fileInput.files.length > 0) {
                fotoBase64 = await getBase64(fileInput.files[0]);
            }

            const newEntry = {
                id: Date.now(),
                tanggal: formatTanggal(document.getElementById('tanggal').value),
                jam: document.getElementById('jam').value,
                kelas: kelas,
                mapel: document.getElementById('mapel').value,
                materi: document.getElementById('materi').value,
                ketAbsen: ketAbsenText,
                detailAbsen: detailAbsenSiswa,
                foto: fotoBase64
            };

            // Simpan ke array dan localStorage
            jurnalData.push(newEntry);
            saveData();
            
            renderTabelJurnal();
            this.reset();
            document.getElementById('absensiContainer').classList.add('hidden');
            alert('Data Jurnal berhasil ditambahkan dan disimpan!');
        });

        // Menyimpan Data ke LocalStorage
        function saveData() {
            localStorage.setItem('jurnalAgusImam', JSON.stringify(jurnalData));
        }

        // Merender Tabel Jurnal di Layar
        function renderTabelJurnal() {
            const tbody = document.getElementById('tabelJurnal');
            tbody.innerHTML = '';
            
            if (jurnalData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">Belum ada data jurnal.</td></tr>`;
                return;
            }

            jurnalData.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-gray-50";
                tr.innerHTML = `
                    <td class="p-2 border">${row.tanggal}</td>
                    <td class="p-2 border">${row.kelas}</td>
                    <td class="p-2 border whitespace-pre-line">${row.materi}</td>
                    <td class="p-2 border text-xs text-red-600">${row.ketAbsen}</td>
                    <td class="p-2 border text-center">
                        <button onclick="hapusBaris(${row.id})" class="text-red-500 font-bold hover:underline">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Hapus satu data (jika salah input)
        function hapusBaris(id) {
            if(confirm('Yakin ingin menghapus jurnal ini?')) {
                jurnalData = jurnalData.filter(d => d.id !== id);
                saveData();
                renderTabelJurnal();
            }
        }

        // Hapus semua data (Reset bulan baru)
        function hapusSemuaData() {
            if(confirm('PERINGATAN! Semua data jurnal, absensi, dan foto bulan ini akan dihapus permanen dari perangkat ini. Lanjutkan?')) {
                jurnalData = [];
                saveData();
                renderTabelJurnal();
            }
        }

        // Panggil render saat pertama kali dimuat
        renderTabelJurnal();

        // -----------------------------------------------------
        // FUNGSI GENERATE PDF MENGGUNAKAN JSPDF
        // -----------------------------------------------------
        function generatePDF() {
            if (jurnalData.length === 0) {
                alert('Tidak ada data untuk dicetak!');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Halaman 1: Jurnal Mengajar
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("LAPORAN JURNAL MENGAJAR GURU", 105, 15, { align: "center" });
            doc.text("SMK NEGERI SUKARESIK", 105, 22, { align: "center" });
            
            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            doc.text("Nama Guru: AGUS IMAM MUHAROM, S.T.", 14, 35);
            doc.text(`Bulan: ${new Date().toLocaleString('id-ID', { month: 'long', year: 'numeric' })}`, 14, 42);

            const tableBody = jurnalData.map((d, index) => [
                index + 1,
                d.tanggal,
                d.jam,
                d.kelas,
                d.mapel,
                d.materi,
                d.ketAbsen
            ]);

            doc.autoTable({
                startY: 48,
                head: [['No', 'Tanggal', 'Jam', 'Kelas', 'Mapel', 'Materi Pembelajaran', 'Ket. Absen']],
                body: tableBody,
                theme: 'grid',
                styles: { fontSize: 9, cellPadding: 2 },
                headStyles: { fillColor: [200, 200, 200], textColor: [0,0,0], halign: 'center' },
                columnStyles: {
                    0: { halign: 'center', cellWidth: 10 },
                    1: { cellWidth: 20 },
                    2: { halign: 'center', cellWidth: 12 },
                    3: { halign: 'center', cellWidth: 20 },
                    4: { cellWidth: 30 },
                    5: { cellWidth: 50 },
                    6: { cellWidth: 40 }
                }
            });

            // Fungsi Pembantu untuk Cetak Rekap Kelas
            function cetakRekapKelas(namaKelas) {
                const dataKelasTerfilter = jurnalData.filter(d => d.kelas === namaKelas);
                if (dataKelasTerfilter.length === 0) return;

                doc.addPage();
                doc.setFontSize(14);
                doc.setFont("helvetica", "bold");
                doc.text("REKAPITULASI ABSENSI SISWA", 105, 15, { align: "center" });
                doc.text("SMK NEGERI SUKARESIK", 105, 22, { align: "center" });
                
                doc.setFontSize(11);
                doc.setFont("helvetica", "normal");
                doc.text("Nama Guru: AGUS IMAM MUHAROM, S.T.", 14, 35);
                doc.text(`Bulan: ${new Date().toLocaleString('id-ID', { month: 'long', year: 'numeric' })}`, 14, 42);
                doc.text(`Kelas: ${namaKelas}`, 14, 49);
                doc.text(`Total Pertemuan: ${dataKelasTerfilter.length} kali`, 14, 56);

                let rekapBody = [];
                dataSiswa[namaKelas].forEach((siswa, index) => {
                    let hadir = 0, sakit = 0, izin = 0, alpa = 0;
                    dataKelasTerfilter.forEach(jurnal => {
                        let status = jurnal.detailAbsen[siswa] || 'Hadir'; // Default jika eror
                        if(status === 'Hadir') hadir++;
                        else if(status === 'Sakit') sakit++;
                        else if(status === 'Izin') izin++;
                        else if(status === 'Alpa') alpa++;
                    });
                    rekapBody.push([index + 1, siswa, hadir, sakit, izin, alpa]);
                });

                doc.autoTable({
                    startY: 62,
                    head: [[{content: 'No', rowSpan: 2}, {content: 'Nama Siswa', rowSpan: 2}, {content: 'Keterangan', colSpan: 4}], 
                           ['H', 'S', 'I', 'A']],
                    body: rekapBody,
                    theme: 'grid',
                    styles: { fontSize: 9, cellPadding: 2 },
                    headStyles: { fillColor: [200, 200, 200], textColor: [0,0,0], halign: 'center' },
                    columnStyles: {
                        0: { halign: 'center', cellWidth: 10 },
                        2: { halign: 'center', cellWidth: 10 },
                        3: { halign: 'center', cellWidth: 10 },
                        4: { halign: 'center', cellWidth: 10 },
                        5: { halign: 'center', cellWidth: 10 }
                    }
                });
            }

            // Halaman 2: Rekap XI TKJ 2
            cetakRekapKelas("XI TKJ 2");
            // Halaman 3: Rekap XII TKJ 2
            cetakRekapKelas("XII TKJ 2");

            // Halaman 4: Dokumentasi
            const fotoData = jurnalData.filter(d => d.foto !== null);
            if(fotoData.length > 0) {
                doc.addPage();
                doc.setFontSize(14);
                doc.setFont("helvetica", "bold");
                doc.text("LAMPIRAN DOKUMENTASI", 105, 15, { align: "center" });
                doc.text("SMK NEGERI SUKARESIK", 105, 22, { align: "center" });

                let yPos = 35;
                let xPos = 14;
                
                fotoData.forEach((item, index) => {
                    // Cek jika gambar melewati batas kertas ke bawah
                    if (yPos > 230) {
                        doc.addPage();
                        yPos = 20;
                        xPos = 14;
                    }
                    
                    doc.setFontSize(10);
                    doc.text(`${item.kelas} - ${item.mapel}`, xPos, yPos);
                    doc.text(`(${item.tanggal})`, xPos, yPos + 5);
                    
                    // Render Image (x, y, width, height)
                    try {
                        doc.addImage(item.foto, 'JPEG', xPos, yPos + 8, 80, 60);
                    } catch(e) {
                        doc.text("[Format gambar tidak didukung/terlalu besar]", xPos, yPos + 30);
                    }

                    // Logika layout 2 kolom gambar (Kiri Kanan)
                    if (xPos === 14) {
                        xPos = 105; // Pindah ke kolom kanan
                    } else {
                        xPos = 14; // Kembali ke kiri
                        yPos += 80; // Turun ke baris bawah
                    }
                });
            }

            // Simpan / Unduh PDF
            doc.save("Laporan_Mengajar_AGUS_IMAM_MUHAROM.pdf");
        }
    </script>
</body>
</html>
